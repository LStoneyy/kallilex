name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal app
        run: pnpm tauri build --target universal-apple-darwin

      - name: Zip app bundle
        run: |
          ditto -c -k --keepParent \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Kallilex.app \
            "Kallilex-${GITHUB_REF_NAME}-macos-universal.zip"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Kallilex-${GITHUB_REF_NAME}-macos-universal.zip" \
            --draft --title "Kallilex $GITHUB_REF_NAME" --generate-notes

  build-release-linux:
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev build-essential

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux bundles
        run: pnpm tauri build

      - name: Rename artifacts and generate checksums
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/release/bundle"

          deb_src=$(find "$bundle_dir/deb" -maxdepth 1 -name '*.deb' | head -n1)
          rpm_src=$(find "$bundle_dir/rpm" -maxdepth 1 -name '*.rpm' | head -n1)
          appimage_src=$(find "$bundle_dir/appimage" -maxdepth 1 -name '*.AppImage' | head -n1)

          [ -n "$deb_src" ] || { echo "::error::no .deb found in $bundle_dir/deb"; exit 1; }
          [ -n "$rpm_src" ] || { echo "::error::no .rpm found in $bundle_dir/rpm"; exit 1; }
          [ -n "$appimage_src" ] || { echo "::error::no .AppImage found in $bundle_dir/appimage"; exit 1; }

          cp "$deb_src" "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.deb"
          cp "$rpm_src" "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.rpm"
          cp "$appimage_src" "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.AppImage"

          sha256sum "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.deb" > "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.deb.sha256"
          sha256sum "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.rpm" > "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.rpm.sha256"
          sha256sum "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.AppImage" > "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.AppImage.sha256"

      - name: Upload Linux artifacts to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.deb" \
            "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.deb.sha256" \
            "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.rpm" \
            "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.rpm.sha256" \
            "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.AppImage" \
            "Kallilex-${GITHUB_REF_NAME}-linux-x86_64.AppImage.sha256"

  build-release-windows:
    runs-on: windows-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows bundle
        run: pnpm tauri build

      - name: Rename artifact and generate checksum
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter "*-setup.exe" -File

          if (-not $installer -or $installer.Count -ne 1) {
            Write-Output "::error::expected exactly one *-setup.exe in $bundleDir, found $(if ($installer) { $installer.Count } else { 0 })"
            exit 1
          }

          $name = "Kallilex-$env:GITHUB_REF_NAME-windows-x86_64-setup.exe"
          Copy-Item -Path $installer.FullName -Destination $name

          $hash = (Get-FileHash -Path $name -Algorithm SHA256).Hash.ToLower()
          $shaPath = "$name.sha256"
          [System.IO.File]::WriteAllText($shaPath, "$hash  $name`n", (New-Object System.Text.UTF8Encoding $false))

      - name: Upload Windows artifacts to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "Kallilex-$env:GITHUB_REF_NAME-windows-x86_64-setup.exe"
          gh release upload "$env:GITHUB_REF_NAME" "$name" "$name.sha256"
