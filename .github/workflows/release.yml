name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal app
        run: pnpm tauri build --target universal-apple-darwin

      - name: Zip app bundle
        run: |
          ditto -c -k --keepParent \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Kallilex.app \
            "Kallilex-${GITHUB_REF_NAME}-macos-universal.zip"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Kallilex-${GITHUB_REF_NAME}-macos-universal.zip" \
            --draft --title "Kallilex $GITHUB_REF_NAME" --generate-notes
