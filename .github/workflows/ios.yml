name: iOS

on:
  push:
    # Without a branch filter, every tag push would run this workflow:
    # path filters aren't evaluated for tags.
    branches: ["**"]
    paths:
      - "ios/**"
      - "contracts/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "contracts/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE" || { echo "No Xcode 26 or later found"; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve simulator
        run: |
          # Newest iPhone simulator whose iOS runtime is at least 26.0 and not
          # newer than the selected Xcode's simulator SDK.
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          SIM_ID=$(xcrun simctl list devices available -j | jq -r --arg sdk "$SDK" '
            ($sdk | split(".") | map(tonumber)) as $max
            | [ .devices | to_entries[]
                | select(.key | test("SimRuntime\\.iOS-"))
                | (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)) as $ver
                | select($ver[0] >= 26 and $ver <= $max)
                | .value[] | select(.name | startswith("iPhone"))
                | {udid, ver: $ver} ]
            | sort_by(.ver) | last | .udid // empty
          ')
          test -n "$SIM_ID" || { echo "No available iPhone simulator for iOS 26 to $SDK found"; exit 1; }
          echo "Using simulator $SIM_ID (simulator SDK $SDK)"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"

      - name: Boot simulator
        run: |
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b

      - name: Test KallilexKit
        working-directory: ios/KallilexKit
        run: |
          xcodebuild test \
            -scheme KallilexKit-Package \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath ../build/kit \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and test Kallilex app (embeds and builds the extensions, runs UI tests)
        run: |
          xcodebuild test \
            -project ios/Kallilex.xcodeproj \
            -scheme Kallilex \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath ios/build/app \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            -resultBundlePath ios/build/KallilexUITests.xcresult

      - name: Upload UI test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KallilexUITests-result-bundle
          path: ios/build/KallilexUITests.xcresult

      - name: Verify app and extension share the same App Group
        run: |
          APP_PATH="ios/build/app/Build/Products/Debug-iphonesimulator/Kallilex.app"
          SHARE_PATH="$APP_PATH/PlugIns/ShareExtension.appex"
          KEYBOARD_PATH="$APP_PATH/PlugIns/KeyboardExtension.appex"
          APP_GROUP=$(/usr/libexec/PlistBuddy -c "Print :KallilexAppGroup" "$APP_PATH/Info.plist")
          SHARE_GROUP=$(/usr/libexec/PlistBuddy -c "Print :KallilexAppGroup" "$SHARE_PATH/Info.plist")
          KEYBOARD_GROUP=$(/usr/libexec/PlistBuddy -c "Print :KallilexAppGroup" "$KEYBOARD_PATH/Info.plist")
          echo "App group (app): $APP_GROUP"
          echo "App group (ShareExtension): $SHARE_GROUP"
          echo "App group (KeyboardExtension): $KEYBOARD_GROUP"
          if [ "$APP_GROUP" != "$SHARE_GROUP" ] || [ "$APP_GROUP" != "$KEYBOARD_GROUP" ]; then
            echo "App and extension KallilexAppGroup values differ"
            exit 1
          fi
          case "$APP_GROUP" in
            group.*) ;;
            *)
              echo "KallilexAppGroup does not start with 'group.'"
              exit 1
              ;;
          esac

          APP_KEYCHAIN=$(/usr/libexec/PlistBuddy -c "Print :KallilexKeychainAccessGroup" "$APP_PATH/Info.plist")
          SHARE_KEYCHAIN=$(/usr/libexec/PlistBuddy -c "Print :KallilexKeychainAccessGroup" "$SHARE_PATH/Info.plist")
          KEYBOARD_KEYCHAIN=$(/usr/libexec/PlistBuddy -c "Print :KallilexKeychainAccessGroup" "$KEYBOARD_PATH/Info.plist")
          echo "Keychain group (app): $APP_KEYCHAIN"
          echo "Keychain group (ShareExtension): $SHARE_KEYCHAIN"
          echo "Keychain group (KeyboardExtension): $KEYBOARD_KEYCHAIN"
          if [ "$APP_KEYCHAIN" != "$SHARE_KEYCHAIN" ] || [ "$APP_KEYCHAIN" != "$KEYBOARD_KEYCHAIN" ]; then
            echo "App and extension KallilexKeychainAccessGroup values differ"
            exit 1
          fi

      - name: Verify plain HTTP is allowed to any server
        run: |
          APP_PATH="ios/build/app/Build/Products/Debug-iphonesimulator/Kallilex.app"
          for BUNDLE in "$APP_PATH" "$APP_PATH/PlugIns/ShareExtension.appex" "$APP_PATH/PlugIns/KeyboardExtension.appex"; do
            ARBITRARY=$(/usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$BUNDLE/Info.plist")
            if [ "$ARBITRARY" != "true" ]; then
              echo "NSAllowsArbitraryLoads is not true in $BUNDLE"
              exit 1
            fi
            # iOS ignores NSAllowsArbitraryLoads while this key is present.
            if /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsLocalNetworking" "$BUNDLE/Info.plist" >/dev/null 2>&1; then
              echo "NSAllowsLocalNetworking must not be set in $BUNDLE"
              exit 1
            fi
          done

      - name: Verify the privacy manifests
        run: |
          plutil -lint ios/Kallilex/Resources/PrivacyInfo.xcprivacy
          plutil -lint ios/ShareExtension/Resources/PrivacyInfo.xcprivacy
          plutil -lint ios/KeyboardExtension/Resources/PrivacyInfo.xcprivacy
          APP_PATH="ios/build/app/Build/Products/Debug-iphonesimulator/Kallilex.app"
          for BUNDLE in "$APP_PATH" "$APP_PATH/PlugIns/ShareExtension.appex" "$APP_PATH/PlugIns/KeyboardExtension.appex"; do
            if [ ! -f "$BUNDLE/PrivacyInfo.xcprivacy" ]; then
              echo "PrivacyInfo.xcprivacy is missing from $BUNDLE"
              exit 1
            fi
          done

      - name: Verify the keyboard requests Full Access
        run: |
          APP_PATH="ios/build/app/Build/Products/Debug-iphonesimulator/Kallilex.app"
          KEYBOARD_PATH="$APP_PATH/PlugIns/KeyboardExtension.appex"
          REQUESTS_OPEN_ACCESS=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:RequestsOpenAccess" "$KEYBOARD_PATH/Info.plist")
          if [ "$REQUESTS_OPEN_ACCESS" != "true" ]; then
            echo "RequestsOpenAccess is not true in $KEYBOARD_PATH"
            exit 1
          fi
          EXTENSION_POINT=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$KEYBOARD_PATH/Info.plist")
          if [ "$EXTENSION_POINT" != "com.apple.keyboard-service" ]; then
            echo "NSExtensionPointIdentifier is $EXTENSION_POINT, expected com.apple.keyboard-service"
            exit 1
          fi
