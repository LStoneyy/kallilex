name: Homebrew

# Bumps Casks/kallilex.rb in LStoneyy/homebrew-tap when a stable release is
# published. Releases are published by hand, not by GITHUB_TOKEN, so the
# `published` event fires. Drafts never fire it, and the vX.Y.Z check below
# keeps pre-releases out of the tap, manual runs included.
#
# HOMEBREW_TAP_TOKEN is a fine-grained token limited to the tap repository
# with Contents: Read and write; github.token only downloads the zip.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the tap, e.g. v0.7.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  bump-cask:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a stable vX.Y.Z tag; pre-release and other non-stable tags are not published to the tap"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download release asset and hash it
        id: download
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "Kallilex-$TAG-macos-universal.zip" --dir "$RUNNER_TEMP/release"
          sha="$(sha256sum "$RUNNER_TEMP/release/Kallilex-$TAG-macos-universal.zip" | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout the tap
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: LStoneyy/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump the cask
        if: steps.resolve.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          SHA256: ${{ steps.download.outputs.sha256 }}
        run: scripts/bump-homebrew-cask.sh tap/Casks/kallilex.rb "$VERSION" "$SHA256"

      - name: Commit and push to the tap
        if: steps.resolve.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::notice::the tap already carries version $VERSION; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "kallilex $VERSION"
          git push origin HEAD:main
